frr defaults traditional
hostname pc-vtep
log stdout informational
!
router bgp 65200
 bgp router-id 10.1.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.168.52.1 remote-as 65100
 neighbor 192.168.52.1 description sonic-as5812
 neighbor 192.168.52.1 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 192.168.52.1 activate
  network 10.1.0.2/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.52.1 activate
  advertise-all-vni
 exit-address-family
exit
!
line vty
